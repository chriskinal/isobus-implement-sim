name: ci
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build can-utils
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Model and DDOP tests, no bus
        run: ctest --test-dir build --output-on-failure
      - name: Virtual CAN
        run: |
          # The arm64 Azure kernel ships vcan in linux-modules-extra, not in the base image.
          if ! sudo modprobe vcan; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add vcan0 type vcan
          # A burst of frames on a vcan with a short queue fails with ENOBUFS and is lost
          sudo ip link set vcan0 txqueuelen 1000
          sudo ip link set vcan0 up
          ip -details link show vcan0
      - name: Phase 0. The seeder example claims an address on vcan0
        run: tests/phase0_vcan.sh build/seeder_example/SeederExample vcan0
      - name: AOG-TaskController source
        uses: actions/checkout@v4
        with:
          repository: AgOpenGPS-Official/AOG-TaskController
          ref: 4ede4034de845031caf9efcca69a85452783439d
          path: aog-tc
      - name: AOG-TaskController build cache
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: aog-tc/build/AOG-TaskController
          key: aog-tc-4ede403-stack-42ea80e-${{ matrix.os }}-v1
      - name: Build AOG-TaskController against the stack this repository fetches
        # Its own pin (c0e1ebb) has the DataSpan bug that scrambles its DDI-to-element map (PLAN.md phase 1 record)
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S aog-tc -B aog-tc/build -G Ninja -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -Wno-dev \
                -DFETCHCONTENT_SOURCE_DIR_ISOBUS="$PWD/build/_deps/agisostack-src"
          cmake --build aog-tc/build --target AOG-TaskController
      - name: Phase 2. Commands and events on the virtual driver, no bus
        run: python3 tests/scenario_commands.py build/implement profiles
      - name: Phase 3. The screens on a headless terminal on vcan0
        run: python3 tests/scenario_vt.py build/implement build/vt_stub vcan0
      - name: Phases 1 and 2. Every profile against AOG-TaskController on vcan0
        run: python3 tests/scenario_tc.py --tc aog-tc/build/AOG-TaskController --implement build/implement --iface vcan0 --keep-log phase1-tc.log
      - name: Keep the task controller's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-tc-log-${{ matrix.os }}
          path: phase1-tc.log
          if-no-files-found: ignore
