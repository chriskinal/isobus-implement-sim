; An ESP32 as a USB serial to I2C bridge for tools/aux_input --joystick-serial (src/main.cpp)
;   pio run -d tools/i2c_bridge -t upload --upload-port /dev/cu.usbserial-XXXX
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; the core's own log would land in the replies
build_flags = -DCORE_DEBUG_LEVEL=0
